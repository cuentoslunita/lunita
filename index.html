<style>
/* Layout: cielo de noche con caramelos pastel. Una columna: luna mascota, personaje, biblioteca, aviso; lector con escena arriba y "hoja de libro" crema abajo. Tema único oscuro a propósito (hora de dormir). */
:root{
  color-scheme: dark;
  --sky:#1b1e4b;
  --sky-2:#252a66;
  --panel:#2d3278;
  --panel-2:#363c8a;
  --line:#4b52a8;
  --moon:#fff4cf;
  --muted:#c6c9f0;
  --cream:#fff7e8;
  --cream-edge:#e6d4ae;
  --ink:#2e2552;
  --ink-soft:#655a8c;
  --sun:#ffc94a;
  --sun-deep:#d99a14;
  --sun-ink:#3b2700;
  --sun-soft:#ffc94a70;
  --mint:#7de3c3;
  --mint-deep:#3aa886;
  --pink:#ff9fc6;
  --pink-deep:#d56592;
  --lilac:#bba6ff;
  --lilac-deep:#7d66d9;
  --blue:#8fd0ff;
  --blue-deep:#4d97d1;
  --coral:#ff8a99;
  --grass:#8ee07a;
  --grass-deep:#4c9e46;
  --notif-bg:#eef0fbf2;
  --notif-ink:#1b2040;
  --notif-muted:#565d8c;
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-story:'Andika','Trebuchet MS',system-ui,sans-serif;
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;background:var(--sky);color:var(--moon);font-family:var(--f-ui);font-size:16px;line-height:1.5;font-weight:600;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 6%, #ffffffaa 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 78% 3%, #ffffff99 50%, transparent 52%),
    radial-gradient(1.4px 1.4px at 92% 14%, #ffffff77 50%, transparent 52%),
    radial-gradient(1.2px 1.2px at 34% 11%, #ffffff88 50%, transparent 52%),
    radial-gradient(1.5px 1.5px at 58% 19%, #ffffff66 50%, transparent 52%),
    linear-gradient(180deg, var(--sky) 0%, #26236a 55%, #33276f 100%);
  background-repeat:no-repeat;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:14px}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:16px 60px}

/* botones "caramelo" */
.btn,.go{border:0;border-radius:18px;padding:12px 20px;font-family:var(--f-display);font-weight:800;font-size:1.1rem;line-height:1.1;background:var(--sun);color:var(--sun-ink);box-shadow:0 5px 0 var(--sun-deep);transition:transform .08s,box-shadow .08s}
.btn:active,.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sun-deep)}
.btn.sec{background:var(--panel-2);color:var(--moon);box-shadow:0 5px 0 #1f2360}
.btn.sec:active{box-shadow:0 1px 0 #1f2360}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.9rem;letter-spacing:.01em}
.logo svg{width:36px;height:36px}
.logo img{width:42px;height:42px;border-radius:50%;box-shadow:0 0 0 2px #ffffff30}
.pill{font-family:var(--f-display);font-size:.9rem;font-weight:700;color:var(--muted);background:var(--panel);border-radius:999px;padding:4px 14px}
.pill.on{color:var(--sun-ink);background:var(--sun)}

.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:12px;align-items:center;padding-block:10px 0}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,1.3rem + 3vw,3.3rem);line-height:1.02;margin:0 0 10px;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--sun)}
.hero p{margin:0;color:var(--muted);font-size:1.08rem;max-width:34rem}
.mascot{width:100%;max-width:440px;justify-self:center;border-radius:30px;box-shadow:0 6px 0 #1f2360;aspect-ratio:4/3;object-fit:cover}
@media (max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}.mascot{order:-1;max-width:170px}}

.step{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:36px 0 14px}
.step .num{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--ink);background:var(--mint);box-shadow:0 4px 0 var(--mint-deep);transform:rotate(-6deg)}
.step .num.pink{background:var(--pink);box-shadow:0 4px 0 var(--pink-deep)}
.step .num.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-deep)}
.step .num svg{width:22px;height:22px}
.step b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;line-height:1.1}

.builder{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;background:var(--panel);border-radius:30px;padding:16px;box-shadow:0 6px 0 #1f2360}
@media (max-width:720px){.builder{grid-template-columns:minmax(0,1fr)}}
.preview{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%, #4b4fb0 0%, #2a2f74 70%);border-radius:24px;padding:14px 14px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:250px}
.preview::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-36px;height:70px;background:var(--panel-2);border-radius:50%}
.preview>*{position:relative;z-index:1}
.preview svg{width:100%;max-width:290px;height:auto}
#preview{width:100%;display:flex;justify-content:center}
.builder .preview{align-self:start;position:sticky;top:12px;padding:10px 10px 18px;min-height:0}
.builder .preview::after{display:none}
@media (max-width:720px){
  .builder{display:block;padding-top:8px}
  .builder .preview{position:sticky;top:0;z-index:20;margin:0 0 12px;padding:6px 8px 8px;border-radius:0 0 22px 22px;box-shadow:0 10px 16px -4px rgba(8,10,38,.7)}
  .builder .pv{aspect-ratio:auto;height:34vh;min-height:190px;max-height:300px;max-width:none;border-radius:18px}
  .builder .preview .who{font-size:1.15rem}
  .builder .preview .with{display:none}
}
.pv{position:relative;width:100%;max-width:520px;aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:#1b2147;margin:0 auto}
.pv img{position:absolute;display:block;width:auto;pointer-events:none;user-select:none;transform:translateX(-50%)}
.pv img.pv-bg{inset:0;width:100%;height:100%;object-fit:cover;transform:none}
.pv .som{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(10,26,30,.6),rgba(10,26,30,0))}
.preview .who{font-family:var(--f-display);font-size:1.6rem;font-weight:800;text-align:center;overflow-wrap:anywhere;line-height:1.1}
.preview .with{color:var(--muted);font-size:.95rem;text-align:center}
.controls{display:grid;gap:14px;min-width:0}
.cg{display:grid;gap:7px}
.lab{font-family:var(--f-display);font-size:1rem;font-weight:700;color:var(--muted)}
.name-in{width:100%;background:var(--cream);color:var(--ink);border:0;border-radius:18px;padding:10px 16px;font-family:var(--f-display);font-size:1.5rem;font-weight:800;box-shadow:inset 0 -4px 0 var(--cream-edge)}
.name-in::placeholder{color:#a99fc4}
.name-in:focus{outline:3px solid var(--sun);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sub{padding:10px 12px;background:var(--sky-2);border-radius:18px}
.sep{width:2px;height:28px;background:var(--line);border-radius:2px}
.sw{width:42px;height:42px;border-radius:50%;border:4px solid var(--panel);box-shadow:0 0 0 2px #ffffff30;padding:0;transition:transform .12s}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--sun);transform:scale(1.1)}
.chip{padding:8px 16px;border-radius:999px;background:var(--sky-2);border:0;font-family:var(--f-display);font-weight:700;font-size:1.02rem;box-shadow:0 4px 0 #181b4e;transition:transform .08s}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 #181b4e}
.chip[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink);box-shadow:0 4px 0 var(--sun-deep)}
.private{margin:0;color:var(--muted);font-size:.86rem;font-weight:600}

.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{--c:var(--lilac);--cd:var(--lilac-deep);background:var(--panel);border:3px solid var(--c);border-radius:26px;padding:10px 10px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;position:relative;box-shadow:0 6px 0 var(--cd);transition:transform .15s}
button.card:hover{transform:translateY(-3px) rotate(-.6deg)}
.card.feature{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:center;padding:12px}
@media (max-width:640px){.card.feature{grid-template-columns:minmax(0,1fr)}}
.card.feature .info{display:flex;flex-direction:column;gap:8px;min-width:0}
.card svg.cover{width:100%;height:auto;border-radius:18px;display:block}
.card img.cover{width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;border-radius:18px;display:block}
.card h3{margin:2px 4px 0;font-family:var(--f-display);font-size:1.35rem;font-weight:800;line-height:1.1}
.card.feature h3{font-size:1.8rem}
.card .src{margin:0 4px;color:var(--muted);font-size:.92rem}
.card .meta{margin:auto 4px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.82rem;font-weight:800;padding-top:4px}
.tag{border-radius:999px;padding:3px 10px;background:var(--sky-2);color:var(--muted)}
.sticker{position:absolute;top:-10px;left:16px;font-family:var(--f-display);font-weight:800;font-size:.95rem;padding:2px 12px;border-radius:999px;transform:rotate(-5deg);color:var(--ink);background:var(--c);box-shadow:0 3px 0 var(--cd);z-index:2}
.badge{position:absolute;top:20px;right:20px;width:38px;height:38px;border-radius:50%;background:#0b1029cc;display:grid;place-items:center}
.badge svg{width:18px;height:18px}
.go{align-self:flex-start;margin:6px 4px 0}
.soon-h{margin:30px 0 12px;font-family:var(--f-display);font-size:1.15rem;font-weight:800;color:var(--muted)}
.soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.soon .card{border:3px dashed var(--line);box-shadow:none;padding:8px 8px 12px;gap:6px}
.soon .card svg.cover{opacity:.6}
.soon .card h3{font-size:1.05rem}
.soon .card .src{font-size:.8rem}

.remind{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;background:var(--panel);border-radius:30px;padding:18px;align-items:center;box-shadow:0 6px 0 #1f2360}
@media (max-width:720px){.remind{grid-template-columns:minmax(0,1fr)}}
.remind .copy{display:grid;gap:12px;min-width:0}
.remind .copy p{margin:0;color:var(--muted)}
.remind .copy h3{margin:0;font-family:var(--f-display);font-size:1.5rem;font-weight:800;line-height:1.1;text-wrap:balance}
.ctrl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Arco de ramas, de frente. Origen abajo a la izquierda. */

  let net='';
  for(let x=10;x<w;x+=10) net+=`<path d="M${x} 0 V${-h}"/>`;
  for(let y=10;y<h;y+=10) net+=`<path d="M0 ${-y} H${w}"/>`;

    <path d="M0 2 V${-h} H${w} V2" stroke="#8a5a3c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 ${-h*.5} l-7 -6 M${w} ${-h*.6} l7 -5" stroke="#8a5a3c" stroke-width="2.4" stroke-linecap="round"/>

}

/* ===== Dibujo: utilidades y fondos ===== */
function rnd(seed){let s=seed;return()=>(s=(s*9301+49297)%233280)/233280}
function stars(n,w,h,seed,dx=0,dy=0,col='#fff'){
  const r=rnd(seed);let o='';
  for(let i=0;i<n;i++) o+=`<circle cx="${(dx+r()*w).toFixed(1)}" cy="${(dy+r()*h).toFixed(1)}" r="${(r()*1.2+.4).toFixed(2)}" fill="${col}" opacity="${(r()*.55+.3).toFixed(2)}"/>`;
  return o;
}
function trees(color,base,seed,trunks=true){
  const r=rnd(seed);let o='';
  for(let i=0;i<9;i++){
    const x=i*48+r()*20-10,rx=30+r()*16,ry=36+r()*24;
    if(trunks) o+=`<rect x="${(x-3).toFixed(1)}" y="${base-10}" width="6" height="60" fill="${color}"/>`;
    o+=`<ellipse cx="${x.toFixed(1)}" cy="${(base-ry*.6).toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="${color}"/>`;
  }
  return o;
}
function starShape(cx,cy,r,fill){
  let p='';for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.45:r;p+=`${(cx+Math.cos(a)*rr).toFixed(1)},${(cy+Math.sin(a)*rr).toFixed(1)} `}
  return `<polygon points="${p}" fill="${fill}"/>`;
}
function fireflies(n,seed,box,notes){
  const r=rnd(seed);let o='';
  for(let i=0;i<n;i++){const x=+(box[0]+r()*box[2]).toFixed(1),y=+(box[1]+r()*box[3]).toFixed(1),d=(r()*2.4).toFixed(2);
    o+=`<g class="ff" style="animation-delay:${d}s"><circle cx="${x}" cy="${y}" r="9" fill="url(#ffg)"/><circle cx="${x}" cy="${y}" r="2.2" fill="#fff1c2"/>${notes&&i%2===0?note(x+6,y-4,.55,'#fff1c2'):''}</g>`}
  return o;
}
function sauce(x,base,s){
  return `<g transform="translate(${x} ${base}) scale(${s})"><rect x="-5" y="-72" width="10" height="72" rx="4" fill="#4a3a2c"/><ellipse cx="0" cy="-84" rx="46" ry="30" fill="#3f6b4c"/>${[-38,-26,-14,-2,10,22,34].map(dx=>`<path d="M${dx} -72 Q${dx+4} -42 ${dx+2} -20" stroke="#4f8a5c" stroke-width="5" fill="none" stroke-linecap="round"/>`).join('')}</g>`;
}
function flowers(seed){
  const r=rnd(seed);let o='';
  for(let i=0;i<16;i++){o+=`<circle cx="${(r()*400).toFixed(1)}" cy="${(218+r()*28).toFixed(1)}" r="2.6" fill="${r()>.5?'#f2b8c0':'#f6d77a'}"/>`}
  return o;
}
function scribble(x,y,w,h,col,seed,sw){
  const r=rnd(seed);let d=`M${x} ${y+h}`;const n=Math.max(2,Math.round(w/7));
  for(let i=1;i<=n;i++){d+=` L${(x+w*i/n).toFixed(1)} ${(i%2?y+r()*3:y+h-r()*3).toFixed(1)}`}
  return `<path d="${d}" stroke="${col}" stroke-width="${sw||2.5}" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>`;
}
function paperBg(){
  let l='';for(let i=0;i<13;i++) l+=`<path d="M0 ${22+i*18} H400" stroke="#9fb3d6" stroke-opacity=".45" stroke-width="1.2"/>`;
  return `<rect width="400" height="250" fill="#efe3c6"/>${l}<path d="M34 0 V250" stroke="#e58a8a" stroke-opacity=".55" stroke-width="1.6"/>`;
}
const PAPER_NIGHT=`<rect width="400" height="250" fill="url(#paperv)"/><rect width="400" height="250" fill="#1b1e4b" opacity=".16"/>`;
function crayonMoon(x,y,r){return `<circle cx="${x}" cy="${y}" r="${r}" fill="#ffe08a" stroke="#e8b93a" stroke-width="3"/>${scribble(x-r*.6,y-r*.5,r*1.2,r,'#f2c94c',7,2)}`}
function inkStars(seed,n,box){
  const r=rnd(seed);let o='';
  for(let i=0;i<n;i++) o+=starShape(+(box[0]+r()*box[2]).toFixed(1),+(box[1]+r()*box[3]).toFixed(1),4+r()*3,'none').replace('fill="none"','fill="none" stroke="#4a6fd1" stroke-width="1.6" stroke-linejoin="round"');
  return o;
}
function fish(x,y,col,s){return `<g transform="translate(${x} ${y}) scale(${s||1})"><path d="M-8 0 l-8 -6 v12z" fill="${col}"/><ellipse rx="10" ry="6" fill="${col}"/><circle cx="4" cy="-1.5" r="1.6" fill="#2a2140"/><path d="M-2 -4 q3 4 0 8" stroke="#fff" stroke-opacity=".6" stroke-width="1.2" fill="none"/></g>`}
/* Puntito, el perrito dibujado a medias. Caja 70×60. estado: 'boceto' | 'cola' | 'estrellas' | 'color' */
function puntito(st){
  const sk=st==='boceto';
  const fill=sk?'none':st==='estrellas'?'#f4e3b8':'#f0c27a';
  const line=sk?'stroke="#8a8a8a" stroke-width="2" stroke-dasharray="5 3"':'stroke="#b9773a" stroke-width="1.6"';
  let tail='';
  if(st==='cola') tail=`<path d="M14 40 Q-4 36 3 24 Q10 14 1 8 Q-5 3 4 -2" stroke="#f0c27a" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if(st==='estrellas') tail=`<path d="M14 40 q-11 -2 -9 -11 q3 -7 9 -2 q3 5 -3 7" stroke="#e2c98f" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  if(st==='color') tail=`<path d="M14 40 q-11 -6 -7 -17" stroke="#f0c27a" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  const spots=st==='estrellas'?starShape(24,41,4,'#6c8be0')+starShape(35,46,3.5,'#ef8ea3')+starShape(31,35,3,'#6c8be0')
    :(sk?'':`<ellipse cx="25" cy="41" rx="5" ry="3.5" fill="#b9773a" opacity=".6"/><ellipse cx="37" cy="46" rx="4" ry="3" fill="#b9773a" opacity=".6"/>`);
  const ear2=sk?'':`<ellipse cx="58" cy="19" rx="4.5" ry="9" fill="${st==='estrellas'?'#f2a65a':'#b9773a'}" transform="rotate(-25 58 19)"/>`;

  ceibo:{
    title:'La canción del ceibo',free:false,src:'Inspirado en la leyenda guaraní de Anahí y la flor del ceibo',
    blurb:'Una noche en las islas del Paraná, una canción que se llevó el viento y un ceibo que no quiere despertar.',

          P(`Al ratito apareció ${CF()}, en la ventana. —Vengo de las islas del Paraná —dijo—. Allá vive Anahí, la chica que canta más lindo de todo el río. El viento del sur se llevó su canción, y sin su canción el ceibo no puede florecer. Tengo una canoa de luna esperando en el arroyo, de esas que navegan solas.`),

        choices:[

      c2:{step:2,scene:'delta',
        text:()=>({

          P(`—El viento del sur me llevó la canción —contó—. Se desarmó en notas, como semillas. Unas se escondieron entre los juncos, con las luciérnagas. Otras se las llevó el viento a la niebla.`),

          P(`Las luciérnagas tenían las notas de Anahí. Cada una llevaba una, chiquita y brillante, que sonaba lin, lan, lon cuando se movía.`)+

      c3b:{step:3,scene:'niebla',

          P(`—¡Son mías! —sopló—. Nadie me canta nunca. Todos cierran las ventanas cuando llego.`)+
          P(`${C()} se escondió detrás de ${N()}. El viento era fuerte, pero también parecía un poquito solo.`),
        q:()=>`¿Qué hace ${N()}?`,
        choices:[

      c4:{step:4,scene:'ceibo',

        q:()=>'La última decisión',
        choices:[

    endings:{

        P(`Al escuchar las dos voces juntas, el ceibo se estiró como quien se despierta de una siesta larga. Y en cada rama se abrió una flor roja, suave como el terciopelo.`)+
        P(`Anahí le dio a ${N()} la primera flor. —Para cuando te dé vergüenza cantar —le dijo—. Las canciones más lindas son las que nos animamos a cantar.`)+
        P(`${N()} volvió a casa con la flor en la mano y se durmió tarareando.`)},
      bondad:{title:'El final del abrazo al ceibo',text:()=>(({valentia:P(`${N()} empezó a cantar con Anahí, con la voz temblando un poquito. Y mientras cantaba, pensó que al ceibo también le hacía falta un abrazo.`),ingenio:P(`${C()} salió a avisarle a todo el río. Mientras esperaban, ${N()} miró el ceibo, tan pelado y tan quieto, y pensó que debía sentirse muy solo.`)})[S.path[3]]||'')+P(`${N()} abrazó el tronco del ceibo bien fuerte, como cuando abrazamos a alguien que extrañamos. ${C()} se sumó al abrazo. El tronco estaba tibio, como si tuviera un corazón adentro.`)+
        P(`—Despertate, ceibo —susurró ${N()}—. Anahí volvió a cantar.`)+
        P(`El ceibo tembló un poquito y, una por una, se abrieron sus flores, rojas como un corazón. Anahí cantó la canción más dulce de todas, y el río entero se quedó escuchando.`)+
        P(`Dicen en el litoral que desde esa noche el ceibo florece cada primavera, para que nadie se olvide de cantarle.`)},
      ingenio:{title:'El final del coro del río',text:()=>(({valentia:P(`${N()} empezó a cantar con Anahí, con la voz temblando un poquito. Pero dos voces solas no alcanzaban para despertar al ceibo.`),bondad:P(`${N()} abrazó el tronco del ceibo y lo sintió tibio, como si escuchara. Entonces se le ocurrió una idea.`)})[S.path[3]]||'')+P(`—¡Ya sé! —dijo ${N()}—. Una voz sola es bajita, pero muchas juntas suenan fuerte.`)+P(`${C()} fue de isla en isla avisando, y llegaron las ranas, los grillos, las luciérnagas y hasta el viento del sur.`)+
        P(`Las ranas hicieron cro cro, los grillos cri cri y el viento fiuuu, todos con la canción de Anahí. Fue el coro más lindo que se escuchó en el Paraná.`)+
        P(`Con tanta música, el ceibo se despertó contento y se llenó de flores rojas.`)+
        P(`Hoy la flor del ceibo es la flor nacional de la Argentina. En las islas cuentan que florece así de roja porque una noche todo el río le cantó.`)+P(`${N()} volvió a casa con el cri cri de los grillos sonando bajito, como una canción de cuna, y se durmió enseguida.`)}

  pichon:{
    title:'El pichón gris',free:true,src:'Inspirado en El patito feo, de Hans Christian Andersen',

          P(`Era un pichón de pato grandote, gris y un poco despeinado, con unas patas enormes y los ojos llenos de lágrimas. Lo había encontrado ${CF()}, en el camino.`)+
          P(`—Me llamo Grisi —dijo el pichón, limpiándose las lágrimas con el ala—. En la laguna todos se ríen de mí. Dicen que soy el patito más raro del mundo. Así que me fui… pero no sé adónde ir.`),

        choices:[

          P(`Grisi se escondió detrás de ${N()}. —Yo soy gris y despeinado —susurró—. No me van a querer.`)+

          {t:()=>'Proponerle que salude con su cuac de trompeta',tr:'ingenio',go:'end'}
        ]}
    },
    endings:{
      valentia:{title:'El final del primer vuelo',text:()=>(({bondad:P(`—Este es Grisi, y nada como nadie —dijo ${N()}. Pero los cisnes todavía estaban lejos, en el medio del lago.`),ingenio:P(`Grisi saludó con un cuac de trompeta, chiquito y tímido. Los cisnes levantaron la cabeza para ver quién era.`)})[S.path[3]]||'')+P(`${N()} caminó con Grisi hasta el borde del agua, paso a paso, aunque a los dos les temblaban un poquito las piernas.`)+

        P(`Los cisnes lo rodearon con sus cuellos largos, como en un abrazo. —¡Un pichón de cisne! —dijeron—. Nosotros también fuimos grises de chiquitos. Te estábamos esperando.`)+
        P(`Grisi se acurrucó debajo del ala del cisne más viejito, tibia como una mantita. Antes de dormirse, abrió un ojo. —Gracias por quererme antes de saber quién era —le dijo a ${N()}.`)+

  dibujos:{
  title:'El cuaderno que despertó', free:false, src:'Cuento original de Lunita',

    d2:{step:2,scene:'hoja_rio',
      text:()=>({
          valentia:P(`${N()} se guardó un puñado de lápices en el bolsillo del pijama, dibujó una puerta con el más grueso, la abrió de un empujón y entró con ${C()}. ¡Pum! Todo era de papel.`),
          ingenio:P(`${N()} agarró el estuche, con todos los lápices bien afilados. —Por las dudas —le dijo a ${C()}.`)+P(`Después dibujó una puerta en la hoja y entraron juntos.`),
          bondad:P(`—Se llama Puntito —contó ${C()}—. Es un perrito que empezaste un día de lluvia y te quedó por la mitad.`)+P(`${N()} se puso la mano en el corazón, agarró sus lápices de colores y dibujó una puerta para ir a buscarlo.`)
        })[S.path[0]]+
        P(`Adentro del cuaderno, las colinas eran de crayón verde y el cielo tenía estrellas dibujadas con birome. Pero en el camino había un río hecho con fibrón azul, todo garabateado, y no tenía ningún puente.`)+
        P(`En el agua nadaban unos pececitos dibujados, chiquitos y de muchos colores.`),
      q:()=>'¿Cómo cruzan el río?',
      choices:[
        {t:()=>'Dibujar un puente con el lápiz marrón',tr:'ingenio',go:'d3a'},
        {t:()=>'Cruzar saltando de pececito en pececito',tr:'valentia',go:'d3b'},
        {t:()=>'Pedirles a los pececitos, por favor, que los lleven',tr:'bondad',go:'d3b'}
      ]},
    d3a:{step:3,scene:'valle_gris',
      text:()=>P(`${N()} dibujó un puente marrón, con barandas y todo. Cruzaron despacito, toc, toc, toc, y ${C()} le dio las gracias al puente.`)+
        P(`Del otro lado había un valle raro: todo estaba dibujado en lápiz gris, sin un solo color. En una rama gris, un pajarito gris intentaba cantar, pero no le salía nada.`)+
        P(`—Me dibujaron sin colores —dijo el pajarito—. Y sin colores no me sale la canción.`),
      q:()=>`¿Qué hace ${N()}?`,
      choices:[
        {t:()=>'Colorearlo despacito, eligiendo con él cada color',tr:'bondad',go:'d4'},
        {t:()=>'Mezclar el amarillo con el celeste para inventar un verde que nadie tiene',tr:'ingenio',go:'d4'}
      ]},
    d3b:{step:3,scene:'isla_nube',
      text:()=>(S.path[1]==='valentia'
          ?P(`${N()} saltó de pececito en pececito: hop, hop, hop. Los pececitos se reían de las cosquillas.`)
          :P(`—¿Nos llevarían, por favor? —les preguntó ${N()} a los pececitos.`)+P(`Los pececitos se pusieron en fila y los cruzaron como un tren de colores.`))+
        P(`Llegaron a una isla de papel. Arriba había una nube dibujada con garabatos negros, que gruñía: grrr, grrr. Cada vez que gruñía, caían gotitas que corrían los dibujos.`)+
        P(`—Si llueve fuerte, se nos borra el camino —dijo ${C()}, preocupado.`),
      q:()=>`¿Qué hace ${N()}?`,
      choices:[
        {t:()=>'Caminar bajo las gotitas hasta la nube y saludarla bien fuerte',tr:'valentia',go:'d4'},
        {t:()=>'Preguntarle a la nube por qué está tan gruñona',tr:'bondad',go:'d4'},
        {t:()=>'Dibujar un paraguas enorme para todos',tr:'ingenio',go:'d4'}
      ]},
    d4:{step:4,scene:'ultima_pagina',
      text:()=>({
          bondad_a:P(`El pajarito eligió cada color con ${N()}, y cuando quedó lleno de plumas de colores, cantó tan lindo que se abrió un caminito de notas hasta la última página.`),
          ingenio_a:P(`${N()} mezcló el amarillo con el celeste y le salió un verde que no estaba en ningún lápiz, brillante como una hoja al sol. El pajarito, todo verde, cantó y les mostró el camino a la última página.`),
          valentia_b:P(`La nube se sorprendió tanto con el saludo que dejó de gruñir.`)+P(`—Nadie me saluda nunca —dijo, y se volvió una nubecita blanca que los acompañó hasta la última página.`),
          bondad_b:P(`—Me dibujaron enojada y no sé cómo cambiar la cara —dijo la nube.`)+P(`${N()} le dibujó una sonrisa, y la nube se puso tan contenta que los llevó flotando hasta la última página.`),
          ingenio_b:P(`${N()} dibujó un paraguas enorme, a rayas, y caminaron todos juntos bajo la lluvia de garabatos, plic, plic, hasta la última página.`)
        })[S.path[2]+(S.path[1]==='ingenio'?'_a':'_b')]+
        P(`Ahí estaba la casita del árbol que ${N()} había empezado, y en la puerta, Puntito: un perrito dibujado a medias, gris, con una sola oreja y sin cola.${S.path[0]==='ingenio'?` Menos mal que ${N()} había traído el estuche entero.`:''}`)+
        P(`—Hola —dijo Puntito bajito—. Me empezaste un día de lluvia y después te fuiste a tomar la leche. ¿Me terminás antes de que salga el sol?`),
      q:()=>'La última decisión',
      choices:[
        {t:()=>'Dibujarle una cola larga y loca, aunque no salga perfecta',tr:'valentia',go:'end'},
        {t:()=>'Preguntarle a Puntito cómo quiere que lo dibuje',tr:'bondad',go:'end'},
        {t:()=>'Dibujar una ventanita al cuarto, para que Puntito nunca más esté solito',tr:'ingenio',go:'end'}
      ]}
  },
  endings:{
    valentia:{title:'El final de la cola torcida',text:()=>(({
        bondad:P(`Puntito pensó un rato. —Quiero una cola… ¡pero no sé cómo! —dijo, y miró a ${N()} esperando.`),
        ingenio:P(`${N()} empezó a dibujar una ventanita, pero Puntito daba saltitos: tenía tantas ganas de tener una cola para mover que no podía esperar.`)
      })[S.path[3]]||'')+
      P(`A ${N()} le daba un poco de miedo que la cola saliera torcida. Respiró hondo y dibujó una cola larga, larguísima, con una vuelta y otra vuelta.`)+
      P(`—Me salió chueca —dijo ${N()}.`)+
      P(`Pero Puntito la movió para un lado y para el otro, fiu, fiu, y se rió. —¡Es la mejor cola del mundo! ¡Sirve para saludar a todos a la vez!`)+
      P(`${N()} le terminó la oreja, le pintó manchas de colores${S.path[3]==='ingenio'?', terminó la ventanita':''} y volvió a la cama con ${C()} justo antes de que saliera el sol. A la mañana, en la última página, había un perrito feliz con la cola más torcida y más linda de todas.`)},
    bondad:{title:'El final de Puntito a su manera',text:()=>(({
        valentia:P(`${N()} se animó y le dibujó una cola larga y torcida. Puntito la movió contento, pero todavía le faltaba todo lo demás.`),
        ingenio:P(`${N()} le dibujó una ventanita en la pared de la casita. Puntito la miró, ilusionado, y le pidió que primero lo terminara.`)
      })[S.path[3]]||'')+
      P(`—¿Cómo te gustaría ser? —le preguntó ${N()}.`)+
      P(`Puntito lo pensó con mucha seriedad. —Quiero manchas como estrellas, una oreja azul y otra naranja${S.path[3]==='valentia'?', y la cola así, chueca, como me la hiciste':', y una cola que haga rulos'}.`)+
      P(`${N()} lo dibujó exactamente así. Cuando terminó, Puntito saltó a sus brazos, ${C()} se sumó al abrazo, y ${N()} recibió un lengüetazo de crayón en la mejilla.`)+
      P(`Esa noche, ya de vuelta en su cama, ${N()} se durmió con la mejilla oliendo a crayón y una sonrisa enorme.${S.path[3]==='ingenio'?' Por la ventanita del cuaderno, Puntito le dijo buenas noches con la cola.':''}`)},
    ingenio:{title:'El final de la ventanita',text:()=>(({
        valentia:P(`${N()} le dibujó a Puntito una cola larga y torcida, y él la movió feliz.`),
        bondad:P(`${N()} le preguntó a Puntito cómo quería ser, y lo dibujó con manchas de estrellas.`)
      })[S.path[3]]||'')+
      P(`Al rato, Puntito ya tenía todos sus colores. Pero miró la casita vacía y se puso triste.`)+P(`—Cuando cierres el cuaderno, me voy a quedar solito otra vez —dijo bajito.`)+
      P(`${N()} pensó un momento y tuvo una idea: dibujó una ventanita redonda en la pared de la casita, que daba justo a su cuarto.`)+
      P(`—Así, cuando quieras, me venís a visitar —dijo ${N()}.`)+P(`Puntito movió la cola, contentísimo.`)+
      P(`Desde esa noche, cuando ${N()} se va a dormir, deja el cuaderno abierto. Y a veces, muy bajito, ${N()} y ${C()} escuchan un guau desde la última página.`)}
  }
},
  futbol:{
  title:'La Copa de la Luna', free:false, src:'Cuento original de Lunita',
  blurb:'Una pelota que habla invita a jugar la Copa de la Luna en el Potrero de los Sueños.',
  start:'f1', endScene:'potrero_copa',
  nodes:{
    f1:{step:1,scene:'casa',
      text:()=>P(`A ${N()} le encantaba jugar al fútbol. Jugaba en el patio, en la plaza y hasta en el pasillo, con una pelota de medias. Su sueño era ser futbolista y jugar en una cancha de verdad.`)+
        P(`Esa noche dejó los botines al lado de la cama y su libreta de jugadas en la mesita de luz. Ya se le cerraban los ojos cuando escuchó: pum, pum, pum. ¡La pelota del patio rebotaba sola sobre la alfombra!`)+
        P(`—Hola, me llamo Saltarina —dijo la pelota—. Esta noche se juega la Copa de la Luna en el Potrero de los Sueños, y el equipo de los horneros necesita ${G('una jugadora más','un jugador más','a alguien más para jugar')}.`)+
        P(`Sentado sobre los botines estaba ${CF()}, listo para jugar.`),
      q:()=>`¿Qué hace ${N()}?`,
      choices:[
        {t:()=>'Ponerse los botines y gritar: «¡Yo juego!»',tr:'valentia',go:'f2'},
        {t:()=>'Llevar la libreta de jugadas, por si hace falta una idea',tr:'ingenio',go:'f2'},
        {t:()=>'Preguntarle a Saltarina si alguien del equipo necesita ayuda',tr:'bondad',go:'f2'}
      ]},
    f2:{step:2,scene:'potrero',
      text:()=>({
          valentia:P(`—¡Yo juego! —gritó ${N()}, mientras se ponía los botines.`)+P(`Se guardó la libreta en el bolsillo del pijama, y ${C()} se puso a su lado.`),
          ingenio:P(`${N()} se puso los botines y agarró la libreta, llena de jugadas dibujadas con flechitas.`)+P(`—Por si hace falta una idea —le dijo a ${C()}.`),
          bondad:P(`—Bigotito, el cuis, está nervioso —contó Saltarina—. Nunca hizo un gol y piensa que es muy chiquito para jugar.`)+P(`${N()} se puso los botines, se guardó la libreta en el bolsillo y le dijo a ${C()}: —Vamos a ayudarlo.`)
        })[S.path[0]]+
        P(`Entonces la alfombra empezó a crecer como pasto, y el cuarto se volvió una cancha enorme bajo la luna: el Potrero de los Sueños. Los arcos eran de ramas y las luciérnagas hacían de reflectores.`)+
        P(`En el equipo de los horneros jugaban Hornerito, el capitán; Don Carpincho, un arquero grandote y tranquilo; y Bigotito, un cuis chiquito y tímido. Enfrente, los teros gritaban: ¡tero-tero, tero-tero! Pip, sonó el silbato de la lechucita árbitra. La pelota iba y venía de un arco al otro, hasta que Saltarina le llegó a ${N()} en la mitad de la cancha.`),
      q:()=>'¿Qué hace con la pelota?',
      choices:[
        {t:()=>'Gambetear a los teros, uno por uno',tr:'valentia',go:'f3b'},
        {t:()=>`Hacer con ${C()} la pared que dibujó en la libreta`,tr:'ingenio',go:'f3b'},
        {t:()=>'Pasársela a Bigotito, que está solito en la punta',tr:'bondad',go:'f3a'}
      ]},
    f3a:{step:3,scene:'potrero_borde',
      text:()=>P(`Bigotito recibió la pelota y se puso tan nervioso que le temblaban los bigotes. Pateó despacito, y la pelota rodó, rodó… hasta el arquero de los teros: un mataco llamado Bolita, que se hizo bolita y la atajó.`)+
        P(`Al ratito, los teros hicieron un gol de cabeza, y las luciérnagas del tablero marcaron 1 a 0. Bigotito se sentó en el borde de la cancha, con las orejas caídas. ${N()} y ${C()} se sentaron a su lado.`)+
        P(`—Yo nunca hago goles —dijo Bigotito bajito—. Soy muy chiquito para el fútbol.`),
      q:()=>`¿Qué hace ${N()}?`,
      choices:[
        {t:()=>'Abrazar a Bigotito y decirle que animarse a patear ya es un montón',tr:'bondad',go:'f4'},
        {t:()=>'Inventar con Bigotito una seña secreta para el próximo pase',tr:'ingenio',go:'f4'},
        {t:()=>'Pedir la pelota y animarse a patear desde lejísimos',tr:'valentia',go:'f4'}
      ]},
    f3b:{step:3,scene:'potrero_nandu',
      text:()=>(S.path[1]==='valentia'
          ?P(`${N()} arrancó con Saltarina pegada al pie: amagó para un lado, salió para el otro, y dejó atrás a un tero, a dos, ¡a tres!`)
          :P(`${N()} le pasó la pelota a ${C()}, y ${C()} se la devolvió enseguida: ¡la pared! Los teros se quedaron mirando. Era la jugada que ${N()} había dibujado en la libreta.`))+
        P(`Los teros ya habían hecho un gol de cabeza, y las luciérnagas del tablero marcaban 1 a 0. Pero ahora, frente al arco, apareció Plumero, el ñandú defensor, con unas patas larguísimas. Atrás esperaba el arquero, un mataco llamado Bolita, listo para hacerse bolita.`)+
        P(`Por el costado venía Bigotito, el cuis, corriendo con sus patitas cortas.`),
      q:()=>`¿Qué hace ${N()}?`,
      choices:[
        {t:()=>'Pasar la pelota por entre las patas largas de Plumero',tr:'valentia',go:'f4'},
        {t:()=>'Picarla despacito por arriba de Plumero',tr:'ingenio',go:'f4'},
        {t:()=>'Pasársela a Bigotito, que viene corriendo por el costado',tr:'bondad',go:'f4'}
      ]},
    f4:{step:4,scene:'potrero_tiro',
      text:()=>({
          bondad_a:P(`Con el abrazo, Bigotito se animó tanto que le sacó la pelota a un tero y se la pasó a Hornerito. ¡Gol del empate!`),
          ingenio_a:P(`La seña funcionó: Bigotito movió los bigotes, ${N()} entendió y corrió hacia el arco. Pase de Bigotito, gol de ${N()}: ¡empate!`),
          valentia_a:P(`${N()} pateó desde lejísimos, ¡pum! La pelota pegó en el palo, y Hornerito, de cabeza, la metió en el arco: ¡empate!`)+P(`Bigotito se levantó de un salto para festejar, y ${N()} lo llamó: —¡Vení, que te necesitamos!`),
          valentia_b:P(`${N()} pasó a Saltarina por entre las patas de Plumero, ¡caño!, y la empujó al arco: ¡empate!`)+P(`—¡Qué jugada! —se rió Plumero, que era un rival muy bueno.`),
          ingenio_b:P(`${N()} picó la pelota por arriba de Plumero, que se estiró, se estiró… y no llegó. La pelota entró despacito: ¡empate!`),
          bondad_b:P(`Bigotito pateó con todas sus fuerzas. La pelota pegó en el travesaño, y Hornerito la empujó al arco: ¡empate! Bigotito saltaba de alegría, aunque el gol no había sido suyo.`)
        })[S.path[2]+(S.path[1]==='bondad'?'_a':'_b')]+
        P(`La luna ya estaba bajando. En la última jugada, la lechucita marcó un tiro libre para los horneros, justo frente al arco. Los teros armaron una barrera, bien juntitos, y Bolita se preparó.`)+
        P(`Saltarina le guiñó un ojo a ${N()}. ${C()} se puso a su lado, Bigotito miraba la pelota con los ojos enormes, y en la libreta había una página doblada: la jugada secreta.`),
      q:()=>`¿Qué hace ${N()} con el tiro libre?`,
      choices:[
        {t:()=>'Patear fuerte al ángulo, aunque tiemblen un poco las piernas',tr:'valentia',go:'end'},
        {t:()=>'Dejar que Bigotito patee su primer tiro libre',tr:'bondad',go:'end'},
        {t:()=>'Hacer la jugada secreta de la página doblada',tr:'ingenio',go:'end'}
      ]}
  },
  endings:{
    valentia:{title:'El final del golazo al ángulo',text:()=>(({
        bondad:P(`${N()} le ofreció la pelota a Bigotito, pero Bigotito sonrió y le dijo: —Hoy patealo vos. Yo te aliento desde acá.`),
        ingenio:P(`${N()} abrió la libreta en la página doblada. La jugada secreta era una sola flecha, gruesa y derechita, que terminaba en el ángulo: ¡había que patear fuerte!`)
      })[S.path[3]]||'')+
      P(`A ${N()} le temblaban un poco las piernas, pero ${C()} le hacía fuerza desde atrás: ¡vamos, vamos! ${N()} respiró hondo, tomó carrera y… ¡pum! Saltarina voló por arriba de la barrera, Bolita se hizo bolita, y la pelota entró justo en el ángulo.`)+
      P(`—¡Golazo! —gritaron los horneros.`)+P(`Y los teros también aplaudieron: ¡tero-tero, qué golazo!`)+
      P(`La luna le dio la Copa de la Luna al equipo de los horneros, y Hornerito invitó a los teros a festejar todos juntos. Esa noche, ${N()} volvió a su cama con ${C()}, ${G('cansada','cansado','con las piernas cansadas')} y feliz. A la mañana, los botines tenían pastito.`)},
    bondad:{title:'El final del primer gol de Bigotito',text:()=>(({
        valentia:P(`${N()} ya estaba por patear fuerte cuando vio a Bigotito mirando la pelota con los ojos enormes. Se frenó y le preguntó: —¿Querés patear vos?`),
        ingenio:P(`${N()} abrió la libreta en la página doblada: la jugada secreta terminaba con una flechita hasta Bigotito. —Te toca a vos —le dijo.`)
      })[S.path[3]]||'')+
      P(`Bigotito temblaba. ${N()} y ${C()} se pusieron a su lado.`)+
      P(`—Mirá el arco, no a los teros —le dijo ${N()}—. Y si no entra, igual estamos con vos.`)+
      P(`Bigotito pateó despacito. La pelota rodó, rodó, pasó entre las patas de un tero, Bolita se hizo bolita para el otro lado… y entró. ¡Gol!`)+
      P(`Lo abrazaron todos: Hornerito, Don Carpincho, ${C()} y hasta los teros. La luna les dio la Copa de la Luna, y el primero en levantarla fue Bigotito. Esa noche, ya en su cama, ${N()} se durmió con una sonrisa enorme.`)},
    ingenio:{title:'El final de la jugada secreta',text:()=>(({
        valentia:P(`${N()} tomó carrera para patear fuerte al ángulo, y justo al llegar a la pelota se acordó de la página doblada. ¡Esa carrera podía ser el amague!`),
        bondad:P(`${N()} le ofreció la pelota a Bigotito, y Bigotito señaló la libreta.`)+P(`—Hagamos la jugada secreta —dijo—. Juntos.`)
      })[S.path[3]]||'')+
      P(`${N()} hizo como que iba a patear con todas sus fuerzas. Los teros de la barrera saltaron todos juntos, ¡tero-tero!, y Bolita se hizo bolita. Entonces ${S.path[3]==='bondad'?'Bigotito':N()} tocó a Saltarina suavecito, por abajo de la barrera, y la pelota entró rodando. ¡Gol!`)+
      P(`—¿Nos enseñás esa jugada? —le pidieron los teros a ${N()}.`)+
      P(`Esa noche, después de recibir la Copa de la Luna, horneros y teros dibujaron jugadas nuevas en la libreta. Y cuando ${N()} se despertó en su cama, con ${C()} durmiendo a su lado, la libreta tenía una página nueva, llena de huellitas de tero.`)}
  }
},
  mundo:{
  title:'El mirador del mundo', free:false, src:'Cuento original de Lunita',
  blurb:'Una noche, el mapa del cuarto se enciende y una luciérnaga busca exploradores. Los adultos eligen si el cuento cuenta que el protagonista nació antes de tiempo.',
  consulta:{texto:'Antes de empezar: este cuento puede contar que el protagonista nació antes de tiempo, chiquito y con muchas ganas. Elegí cómo querés leerlo.',si:'Que cuente que nació antes de tiempo',no:'Leerlo sin eso'},
  start:'m1', endScene:'mirador_final',
  nodes:{
    m1:{step:1,scene:'cuarto_mapa',
      text:()=>(S.consulta!=='no'
        ?P(`Cuando ${N()} nació, cabía en una sola mano, con los piecitos apenas asomando. Había llegado antes de tiempo, con muchas ganas de empezar a vivir. Todos cuidaron de ${N()} con muchísima paciencia: le cantaban bajito, le contaban cuentos y le daban todo el tiempo del mundo.`)+
        P(`Y ${N()} fue creciendo, creciendo, creciendo. Hoy juega, canta y se ríe fuerte. Y tiene un sueño enorme: conocer el mundo entero. Por eso, sobre la cama, hay un mapa gigante, y ${N()} lo mira todas las noches antes de dormir.`)
        :P(`A ${N()} le encantan los mapas. Sobre la cama hay un mapa gigante, y ${N()} lo mira todas las noches antes de dormir. Tiene un sueño enorme: conocer el mundo entero.`))+
        P(`Esa noche, un puntito del mapa empezó a titilar: pip, pip, pip. Del puntito salió Brillita, una luciérnaga chiquitita, y ${CF()}, la miró con los ojos muy abiertos.`)+
        P(`—Busco exploradores —dijo Brillita, con su lucecita cansada—. Hay un mirador desde donde se ve el mundo entero, pero hay que llegar antes de que la luna suba a lo más alto del cielo.`),
      q:()=>`¿Qué hace ${N()}?`,
      choices:[
        {t:()=>'Tocar con el dedito el puntito brillante del mapa',tr:'valentia',go:'m2'},
        {t:()=>'Agarrar el lápiz de la mesita y marcar el puntito en el mapa',tr:'ingenio',go:'m2'},
        {t:()=>'Preguntarle a Brillita por qué brilla tan despacito',tr:'bondad',go:'m2'}
      ]},
    m2:{step:2,scene:'pastos',
      text:()=>({
          valentia:P(`${N()} tocó el puntito con el dedo y, ¡fiu!, el mapa se encendió como una ventana. Brillita se rió, y ${C()} se pegó bien cerquita de ${N()}.`),
          ingenio:P(`${N()} marcó el puntito con el lápiz y después guardó ese lápiz en el bolsillo del pijama.`)+P(`—Por si hay que anotar algo —dijo. Y entonces, ¡fiu!, el mapa se encendió como una ventana.`),
          bondad:P(`—Hoy me quedé sin polvito de luz —contó Brillita—. Pero cuando alguien me acompaña, me pongo contenta y brillo más fuerte. ${N()} le sonrió, y ${C()} dijo que sí con la cabeza. Entonces, ¡fiu!, el mapa se encendió como una ventana.`)
        })[S.path[0]]+
        P(`Cuando miraron alrededor, ${N()} y ${C()} se habían achicado hasta entrar en una hoja de trébol. Todo se veía enorme, ¡pero las ganas eran las mismas de siempre!`)+
        P(`Los pastos altos parecían árboles, y las flores, paraguas gigantes. Y no se veía ningún camino.`),
      q:()=>'¿Cómo buscan el camino entre los pastos altos?',
      choices:[
        {t:()=>'Meterse entre los pastos y seguir siempre derecho',tr:'valentia',go:'m3b'},
        {t:()=>`Marcar flechas en la tierra con ${S.path[0]==='ingenio'?'el lápiz':'un palito del suelo'}`,tr:'ingenio',go:'m3a'},
        {t:()=>'Preguntarle a un grillo que canta solito si conoce el camino',tr:'bondad',go:'m3b'}
      ]},
    m3a:{step:3,scene:'tronco',
      text:()=>P(`${N()} dibujó una flecha en la tierra con ${S.path[0]==='ingenio'?'el lápiz':'el palito'}, después otra y otra, y ${C()} iba adelante marcando el paso. Siguiendo las flechas, llegaron a un tronco enorme.`)+
        P(`En el tronco había una puertita redonda, tan chiquita que solo podía pasar alguien de su tamaño. Era el Atajo del Mundo. Afuera esperaba Doña Vizcacha, de bigotes largos y paso tranquilo, con la nariz pegada a la puerta.`)+
        P(`—Yo también quiero llegar al mirador —suspiró—, pero por ahí no entro. Y adentro del túnel está muy oscuro.`),
      q:()=>`¿Qué hace ${N()}?`,
      choices:[
        {t:()=>`Entrar por la puertita oscura, con ${C()} adelante`,tr:'valentia',go:'m4'},
        {t:()=>'Pedirle a Brillita que alumbre el túnel con su lucecita',tr:'ingenio',go:'m4'},
        {t:()=>'Prometerle a Doña Vizcacha que la esperan del otro lado',tr:'bondad',go:'m4'}
      ]},
    m3b:{step:3,scene:'rocio',
      text:()=>(S.path[1]==='valentia'
          ?P(`${N()} se metió entre los pastos, apartando una hoja por vez: fru, fru, fru. ${C()} iba detrás, pegadito, y Brillita alumbraba el camino desde arriba.`)
          :P(`—Claro que lo conozco —cantó el grillo—, pero siempre canto solito y nadie me escucha.`)+P(`${N()} y ${C()} se sentaron a escuchar el concierto hasta el final. El grillo, contento, les señaló el camino entre los pastos.`))+
        P(`Los pastos se abrieron en un arroyito de rocío, brillante como un espejo, que bajaba hasta el pie de una colina. En la orilla esperaba Don Caracol, con su casita a cuestas, mirando el agua. Del otro lado se levantaba la colina.`)+
        P(`—Quiero subir a la colina —dijo—, pero mi casita pesa mucho para cruzar.`),
      q:()=>`¿Qué hace ${N()}?`,
      choices:[
        {t:()=>'Cruzar por las piedritas con Don Caracol agarrado de la mano',tr:'valentia',go:'m4'},
        {t:()=>'Armar con hojas secas una balsita para cruzar todos juntos',tr:'ingenio',go:'m4'},
        {t:()=>`Cargar entre ${N()} y ${C()} la casita de Don Caracol`,tr:'bondad',go:'m4'}

    m4:{step:4,scene:'mirador',
      text:()=>({
          valentia_a:P(`${N()} entró por la puertita oscura, con ${C()} adelante: toc, toc, toc. Al fondo se veía un cuadradito de luna, y de golpe salieron a la colina. Doña Vizcacha dio la vuelta por el camino largo, resoplando, y llegó justo detrás.`),
          ingenio_a:P(`Brillita alumbró el túnel con su lucecita, y las paredes de tierra brillaron como un cielo de estrellitas. Caminaron mirándolas hasta el final y salieron a la colina. Doña Vizcacha dio la vuelta por el camino largo, resoplando, y llegó justo detrás.`),
          bondad_a:P(`—Prometo que te esperamos —le dijo ${N()} a Doña Vizcacha. Doña Vizcacha dio la vuelta por el camino largo, resoplando. Los demás cruzaron el túnel, que se iluminó porque Brillita brillaba de contenta. Se encontraron todos en la colina.`),
          valentia_b:P(`${N()} cruzó por las piedritas: plic, plic, plic. Estiró la mano y Don Caracol cruzó agarrado de ella, con su casita a cuestas. Después subieron juntos la colina.`),
          ingenio_b:P(`Con las hojas secas armaron una balsita, y ${C()} ayudó a empujarla suavemente. Cruzaron todos sentados en fila, y después subieron juntos la colina.`),
          bondad_b:P(`Entre ${N()} y ${C()} levantaron la casita de Don Caracol, ¡qué liviana entre tantos!, y cruzaron. Después subieron juntos la colina.`)
        })[S.path[2]+(S.path[1]==='ingenio'?'_a':'_b')]+
        P(`Llegaron al Mirador del Mundo justo cuando la luna estaba por llegar a lo más alto del cielo. Desde ahí se veía todo: mares brillantes como plata, montañas con gorros de nieve, desiertos dorados y ciudades con ventanitas prendidas.`)+
        P(`${N()} abrió muy grandes los ojos. Era el mundo que miraba todas las noches en el mapa, pero de verdad.`),
      q:()=>`¿Qué hace ${N()} frente al mundo?`,
      choices:[
        {t:()=>'Gritar bien fuerte: «¡Mundo, algún día voy a conocerte!»',tr:'valentia',go:'end'},
        {t:()=>'Hacerles lugar a todos en la punta de la colina y mirar juntos',tr:'bondad',go:'end'},
        {t:()=>'Dibujar en la tierra el mapa de los lugares que quiere conocer',tr:'ingenio',go:'end'}
      ]}
  },
  endings:{
    valentia:{title:'El final del grito al mundo',text:()=>(({
        bondad:P(`${N()} les hizo lugar a todos en la punta de la colina, y desde ahí miraron juntos el mundo. Entonces ${N()} sintió muchas ganas de decirle algo al horizonte.`),
        ingenio:P(`${N()} dibujó en la tierra el mapa de los lugares que soñaba conocer. Al terminar miró el dibujo y miró el mundo de verdad: eran tan parecidos que le dieron ganas de decirle algo al horizonte.`)
      })[S.path[3]]||'')+
      P(`—¡Mundo! —gritó ${N()}, con todas las fuerzas—. ¡Algún día voy a conocerte!`)+
      P(`La montaña devolvió el eco: ¡conocerte… conocerte… conocerte! Los mares brillaron más fuerte, y todas las ciudades prendieron una ventanita nueva, como si dijeran «te esperamos».`)+
      P(`—Con tantas ganas desde el primer día —dijo Brillita—, ¡mirá hasta dónde llegaste!`)+P(`${C()} también gritó, a su manera, y todos se rieron.`)+

    bondad:{title:'El final del lugar para todos',text:()=>(({
        valentia:P(`${N()} ya estaba por gritar con todas las fuerzas, pero se dio cuenta de que ${S.path[1]==='ingenio'?'Doña Vizcacha':'Don Caracol'} estaba atrás, sin lugar para mirar.`),
        ingenio:P(`${N()} dibujó en la tierra el mapa de los lugares que soñaba conocer, y se dio cuenta de que ${S.path[1]==='ingenio'?'Doña Vizcacha':'Don Caracol'} estaba atrás, sin lugar para mirar.`)
      })[S.path[3]]||'')+
      P(`${S.path[3]==='bondad'?'Para hacerles lugar':'Entonces'}${S.path[3]==='bondad'?`, ${N()} se corrió un poquito`:` ${N()} se corrió un poquito`}, ${C()} se corrió otro poquito, y en la punta de la colina apareció lugar para todos.`)+
      P(`Se sentaron juntos, bien apretaditos: Brillita, ${S.path[1]==='ingenio'?'Doña Vizcacha':'Don Caracol'}, ${C()} y ${N()}. Desde ahí, el mundo se veía todavía más lindo.`)+
      P(`—Qué suerte que nos encontramos —dijo ${S.path[1]==='ingenio'?'Doña Vizcacha':'Don Caracol'}—. Sin ayuda, no habría llegado nunca.`)+
      P(`Brillita brilló tan fuerte de contenta que la colina entera se iluminó. En casa siempre contaban que, cuando ${N()} llegó al mundo, muchas manos estuvieron para cuidar. Esa noche, el mapa los devolvió al cuarto, a su tamaño de siempre, y ${N()} se durmió pensando en lo lindo que es ser una de esas manos.${S.path[0]==='ingenio'?' El lápiz esperaba en la mesita, listo para la próxima.':''}`)},
    ingenio:{title:'El final del mapa propio',text:()=>(({
        valentia:P(`Después de gritar con todas las fuerzas, ${N()} se quedó pensando: eran tantos lugares que no sabía por cuál empezar.`),
        bondad:P(`Cuando todos se acomodaron en la punta de la colina, ${N()} se quedó pensando: eran tantos lugares que no sabía por cuál empezar.`)
      })[S.path[3]]||'')+
      P(`Entonces dibujó en la tierra, con ${S.path[0]==='ingenio'?'el lápiz':(S.path[1]==='ingenio'?'el palito de las flechas':'un palito que encontró en el suelo')}, un mapa propio: una montaña, un río largo y un mar. Los unía una línea de puntitos que arrancaba en su cuarto.`)+
      P(`—Un lugar por vez —dijo ${N()}—. No hay apuro.`)+
      P(`Brillita se posó en el primer puntito, y la línea se encendió como un caminito de luz. ${C()} la siguió con la mirada hasta el final.`)+
      P(`De a poco el mundo se fue apagando, el mapa los devolvió al cuarto, a su tamaño de siempre, y ${N()} volvió a la cama con ${C()}. En la pared, el mapa tenía una línea de puntitos brillando: el primer camino de muchos. ${N()} se durmió pensando por dónde empezar mañana.`)}
  }
}

function tonight(){
  const ids=S.subscribed?Object.keys(STORIES):['luna'];
  const d=new Date();
  const id=ids[(d.getFullYear()*372+d.getMonth()*31+d.getDate())%ids.length];
  return {id,title:STORIES[id].title};
}
function notifHTML(live){
  const t=tonight();
  const inner=`<span class="nicon">${ICON.moon}</span><span class="ntext"><span class="nhead"><span>Lunita</span><span>ahora</span></span><span class="ntitle">Es la hora del cuento</span><span class="nbody">Esta noche: ${t.title}, con ${N()}. Tocá para empezar.</span></span>`;
  return live?`<button class="notif" data-act="toast-open" aria-label="Abrir el cuento de esta noche">${inner}</button>`:`<div class="notif">${inner}</div>`;
}
function reminderHTML(){

    ?`<div class="ctrl"><button class="chip" data-act="rem-toggle" aria-pressed="${r.on}">${r.on?'Aviso activado':'Aviso apagado'}</button><label for="remTime" class="lab">a las</label><input type="time" id="remTime" class="time-in" value="${r.time}"></div>

    <div class="lock-screen" role="img" aria-label="Así se ve el aviso en el celular"><div class="clock" id="remClock">${r.time}</div><div class="date">${date.charAt(0).toUpperCase()+date.slice(1)}</div>${notifHTML(false)}</div></div>`;

let toastTimer=0;
function showToast(){
  const t=document.getElementById('toast');
  t.innerHTML=notifHTML(true);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.innerHTML=''},8000);
}
function hideToast(){clearTimeout(toastTimer);document.getElementById('toast').innerHTML=''}
setInterval(()=>{
  if(!S.subscribed||!S.reminder.on) return;
  const d=new Date(),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),key=d.toDateString();
  if(hm===S.reminder.time&&S.lastNotified!==key){S.lastNotified=key;save();showToast()}
},20000);

/* ===== Cobro: permiso firmado (la función de Lunita lo emite si Mercado Pago confirma el pago) ===== */
const PERMISO_KEY='lunita_permiso';
const MSG_COBRO={no_encontrada:'No encontramos una suscripción con ese mail. Probá con el mail de tu cuenta de Mercado Pago (puede ser distinto del que usás todos los días). Si ya pagaste y sigue sin andar, escribinos a '+CONTACT_EMAIL+' con el mail que usaste.',pendiente:'Mercado Pago todavía no confirmó el pago. Probá de nuevo en unos minutos.',vencida:'Esa suscripción ya no está vigente. Podés suscribirte de nuevo.',mail_invalido:'Ese mail no parece estar bien escrito.',mp_no_responde:'No pudimos comprobar el pago ahora. Probá de nuevo en un rato.',red:'No hay conexión con Lunita. Revisá tu internet y probá de nuevo.',otro:'Algo salió mal. Probá de nuevo en un rato.'};
function b64uBytes(t){const b=atob(t.replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function verificarPermiso(token){
  try{
    const [parte,firma]=String(token).split('.');if(!parte||!firma) return null;
    const clave=await crypto.subtle.importKey('jwk',COBRO.CLAVE,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    const ok=await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},clave,b64uBytes(firma),new TextEncoder().encode(parte));
    if(!ok) return null;
    const c=JSON.parse(new TextDecoder().decode(b64uBytes(parte)));
    return c&&c.v===1&&c.p==='lunita-ilimitado'&&typeof c.exp==='number'?c:null;
  }catch(e){return null}
}
function leerPermiso(){try{return JSON.parse(localStorage.getItem(PERMISO_KEY)||'null')}catch(e){return null}}
function guardarPermiso(o){try{o?localStorage.setItem(PERMISO_KEY,JSON.stringify(o)):localStorage.removeItem(PERMISO_KEY)}catch(e){}}
/** Pide un permiso a la función. Devuelve {ok:true} o {ok:false,motivo}. Solo un permiso con firma válida y no vencido abre los cuentos. */
async function pedirPermiso(email){
  let r;
  try{
    const res=await fetch(COBRO.API.replace(/\/$/,'')+'/activar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    r=await res.json();
  }catch(e){return {ok:false,motivo:'red'}}
  if(!r||!r.ok) return {ok:false,motivo:(r&&r.motivo)||'otro'};
  const c=await verificarPermiso(r.token);
  if(!c||c.exp*1000<=Date.now()) return {ok:false,motivo:'otro'};
  guardarPermiso({token:r.token,email:email.trim().toLowerCase()});
  return {ok:true,exp:c.exp};
}
/** Al abrir la app: si hay un permiso guardado y vale, se abren los cuentos; si falta poco para que venza, se renueva sin molestar. */
async function restaurarPermiso(){
  
  const g=leerPermiso();if(!g||!g.token) return;
  const c=await verificarPermiso(g.token);
  const vigente=!!c&&c.exp*1000>Date.now();
  if(vigente){S.subscribed=true;render()}
  if(!c||c.exp*1000-Date.now()<7*864e5){
    const n=await pedirPermiso(g.email);
    if(n.ok){S.subscribed=true;render()}
    else if(!vigente&&['no_encontrada','vencida'].includes(n.motivo)){guardarPermiso(null);S.subscribed=false;render()}   // solo se cierra si Mercado Pago confirma que ya no vale
  }
}

/* ===== Lectura en voz alta ===== */
let speakToken=0;
function stopSpeech(){
  speakToken++;
  if(SYNTH){try{speechSynthesis.cancel()}catch(e){}}
  document.querySelectorAll('.reading').forEach(p=>p.classList.remove('reading'));
}
function pickVoice(){
  try{const vs=speechSynthesis.getVoices();
    return vs.find(v=>/^es[-_]AR/i.test(v.lang))||vs.find(v=>/^es[-_](419|MX|US|CO|CL|UY)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null;
  }catch(e){return null}
}
function speakPage(){
  if(!SYNTH||!S.audio) return;
  stopSpeech();
  const tok=speakToken;
  const items=[...document.querySelectorAll('#reader .story p')].map(el=>({el,text:el.textContent}));
  const q=document.querySelector('#reader .choices .q');
  const ops=[...document.querySelectorAll('#reader .choice .opt')].map(s=>s.textContent);
  if(q&&ops.length) items.push({el:q.parentElement,text:q.textContent+' '+ops.join(', o ')+'.'});
  const v=pickVoice();
  items.forEach((it,i)=>{
    try{
      const u=new SpeechSynthesisUtterance(it.text.replace(/[—«»]/g,', '));
      if(v) u.voice=v;
      u.lang=v?v.lang:'es-ES';u.rate=.9;u.pitch=1.05;
      u.onstart=()=>{if(tok!==speakToken)return;document.querySelectorAll('.reading').forEach(p=>p.classList.remove('reading'));it.el.classList.add('reading')};
      u.onend=()=>{if(tok!==speakToken)return;it.el.classList.remove('reading');if(i===items.length-1){S.audio=false;syncAudioBtn()}};
      speechSynthesis.speak(u);
    }catch(e){}
  });
}
function syncAudioBtn(){
  const b=document.querySelector('[data-act="audio"]');if(!b) return;
  b.classList.toggle('on',S.audio);b.setAttribute('aria-pressed',String(S.audio));
  b.setAttribute('aria-label',S.audio?'Detener la lectura':'Escuchar el cuento');
  b.innerHTML=S.audio?ICON.stop:ICON.spk;
}

      S.node='end';save();
    }else S.node=ch.go;

  }
  else if(act==='subscribe'){S.subscribed=true;save();S.modal={type:'done',next:S.pending||PREMIUM[0]};renderModal();if(S.screen==='home')render()}

  else if(act==='rem-toggle'){

  }
  else if(act==='rem-test') showToast();

});
document.addEventListener('submit',async e=>{
  if(e.target.id==='activarForm'){
    e.preventDefault();if(!S.modal||S.modal.espera) return;
    const email=document.getElementById('activarIn').value.trim();
    S.modal={type:'activar',email,msg:'',espera:true};renderModal();

  if(e.target.id!=='gateForm') return;
  e.preventDefault();
  const v=Number(document.getElementById('gateIn').value.trim());
  if(v===S.modal.a+S.modal.b){S.gatePassed=true;S.modal={type:'pay'}}
  else S.modal.err=true;
  renderModal();
});
document.addEventListener('input',e=>{
  if(e.target.id==='name'){S.cfg.name=e.target.value.slice(0,16);updatePreview();save()}
  if(e.target.id==='remTime'&&e.target.value){S.reminder.time=e.target.value;save();const c=document.getElementById('remClock');if(c)c.textContent=e.target.value}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal) closeModal()});

function start(data){
  if(data&&data.cfg){Object.assign(S,data);S.modal=null;S.audio=false;S.endings=Object.assign({luna:[],tortuga:[],ceibo:[],pichon:[],dibujos:[],futbol:[],mundo:[]},S.endings)}else load();
  render();renderModal();
  restaurarPermiso();
}
window.claude?.hot?.snapshot?.(()=>({...S,modal:null,audio:false}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
